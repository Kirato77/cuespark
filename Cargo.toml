[package]
name = "cuespark"
version = "0.3.3"
edition = "2024"
description = "Instant playback of show sound cues (theatre, live events)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kirato77/cuespark"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11", "clipboard", "accesskit"] }
egui_extras = "0.37"
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
rubato = "5"
rtrb = "0.4"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
self-replace = "1"
sha2 = "0.11"
midir = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Decoding in debug builds is too slow to be usable.
[profile.dev.package."*"]
opt-level = 3
